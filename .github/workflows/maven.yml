name: Java CI with Maven

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main", "feature/I1S-7.7-g2" ]
    types: [ opened, edited, synchronize, reopened ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build and run all tests
      run: ./mvnw -B verify

  conventions:
    if: github.event_name == 'pull_request' && github.base_ref == 'feature/I1S-7.7-g2'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Check branch, PR title and body
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BRANCH: ${{ github.head_ref }}
        PR_BODY: ${{ github.event.pull_request.body }}
      run: scripts/git/check-pr.sh "$PR_TITLE" "$PR_BRANCH" "$PR_BODY"
    - name: Check commit messages
      env:
        PR_BRANCH: ${{ github.head_ref }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        message_file="$(mktemp)"
        for commit in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
          git log -1 --format=%B "$commit" > "$message_file"
          scripts/git/check-commit-msg.sh "$message_file" "$PR_BRANCH"
        done
