logging:
    level:
        org:
            hibernate:
                type: TRACE
spring:
    datasource:
        driver-class-name: org.h2.Driver
        password: sa
        url: jdbc:h2:mem:db;DB_CLOSE_DELAY=-1
        username: sa
    jpa:
        defer-datasource-initialization: true
        hibernate:
            ddl-auto: create-drop
        properties:
            hibernate:
                format_sql: true
        show-sql: true
    main:
        allow-bean-definition-overriding: true
    sql:
        init:
            mode: always
